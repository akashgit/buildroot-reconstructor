name: Regression Suite

on:
  push:
    paths:
      - 'src/buildroot/agent/**'
      - 'src/buildroot/eval/**'
  pull_request:
    paths:
      - 'src/buildroot/agent/**'
      - 'src/buildroot/eval/**'

jobs:
  regression:
    name: Regression — Quick (canary)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run regression suite (quick)
        run: buildroot regression --quick
