name: Regression Suite

on:
  push:
    paths:
      - 'src/buildroot/agent/**'
      - 'src/buildroot/eval/**'
  pull_request:
    paths:
      - 'src/buildroot/agent/**'
      - 'src/buildroot/eval/**'

jobs:
  regression:
    name: Regression — Quick (canary)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RH_H100_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H rh-h100-01 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run regression suite (quick)
        run: buildroot regression --quick --host rh-h100-01
